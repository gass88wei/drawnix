appId: com.drawnix.desktop
productName: Drawnix
copyright: Copyright © Drawnix Team and contributors

directories:
  output: release
  buildResources: assets

files:
  - main.cjs
  - package.json
  - dist/**/*
  - assets/icon.png

extraMetadata:
  main: main.cjs

# electron-builder 26 crashes while writing its auto-update info when no publish
# provider is resolvable ("Cannot read properties of null (reading 'channel')").
# Declaring the provider is enough; the workflow passes `--publish never` and
# uploads the artifacts to the Release itself.
publish:
  provider: github
  owner: gass88wei
  repo: drawnix

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  icon: icon.png
  synopsis: 开源白板、思维导图与流程图工具
  description: >-
    Drawnix 是一体化开源白板工具，集成思维导图、流程图、自由画，支持无限画布、
    自动保存与本地文件导入导出。本包由上游 Web 版本封装为离线桌面应用。
  executableName: drawnix
  syncDesktopName: true
  desktop:
    entry:
      Name: Drawnix
      Comment: 开源白板 / 思维导图 / 流程图
      Categories: Graphics;Office;Development;
      Keywords: whiteboard;mindmap;flowchart;drawing;diagram;

appImage:
  artifactName: Drawnix-${version}-x86_64.AppImage

deb:
  artifactName: Drawnix-${version}-amd64.deb
  priority: optional
  compression: xz
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    - libdrm2
    - libgbm1
    - libxkbcommon0
