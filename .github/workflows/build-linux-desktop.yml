name: build-linux-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # glibc 2.35 baseline: runs on Deepin 25 (glibc 2.38) and Debian 12.
    # Do NOT switch to ubuntu-latest / 24.04 — its glibc 2.39 breaks older targets.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Build web app
        run: npx nx build web

      - name: Verify web build output
        run: |
          set -euo pipefail
          test -f dist/apps/web/index.html
          test -n "$(find dist/apps/web -name '*.js' -print -quit)"
          du -sh dist/apps/web

      - name: Assemble desktop package
        run: |
          set -euo pipefail
          rm -rf desktop/dist
          cp -r dist/apps/web desktop/dist
          ls desktop/dist

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build AppImage + deb
        working-directory: desktop
        # No GH_TOKEN here on purpose: with a token set, electron-builder tries to
        # resolve a publish channel during cleanup and crashes when it cannot.
        # The Release step below uploads the artifacts with gh instead.
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -la desktop/release
          APPIMAGE=$(find desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)
          DEB=$(find desktop/release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$APPIMAGE"
          test -n "$DEB"
          chmod +x "$APPIMAGE"
          # deb 里必须同时有 electron 主程序、app.asar 和图标
          mkdir -p /tmp/debcheck
          dpkg-deb -x "$DEB" /tmp/debcheck
          find /tmp/debcheck -name 'app.asar' -print -quit
          find /tmp/debcheck -name 'drawnix' -type f -print -quit
          find /tmp/debcheck -name 'drawnix.png' -print -quit
          du -sh /tmp/debcheck/opt/*
          sha256sum "$APPIMAGE" "$DEB" | tee /tmp/checksums.txt

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          python3 -c "import json,pathlib;v=json.load(open('desktop/package.json'))['version'];c=pathlib.Path('/tmp/checksums.txt').read_text().strip();t=pathlib.Path('desktop/release-notes.md').read_text().replace('@VERSION@',v).replace('@CHECKSUMS@',c);pathlib.Path('/tmp/notes.md').write_text(t)"
          cat /tmp/notes.md

      - name: Upload artifacts (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: drawnix-linux-x64
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            desktop/release/*.AppImage \
            desktop/release/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "Drawnix ${GITHUB_REF_NAME} Linux 桌面版" \
            --notes-file /tmp/notes.md
